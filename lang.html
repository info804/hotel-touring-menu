<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="192x192" href="icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
  <link rel="manifest" href="site.webmanifest">
  <title>Hotel Touring Livigno — Lingua / Language</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Patrick+Hand&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:          #F5EEDF;
      --header-bg:   #EBDCC2;
      --card-bg:     #FBF7EC;
      --ink:         #3B2E24;
      --ink-soft:    #6E5C4B;
      --accent:      #B05730;
      --accent-deep: #8E4324;
      --accent-tint: #E9D3C2;
      --line:        #D9C7A6;
    }

    html, body {
      background:  var(--bg);
      font-family: 'Patrick Hand', 'Helvetica Neue', sans-serif;
      color:       var(--ink);
    }

    /* Header */
    .lang-header {
      background:  var(--header-bg);
      text-align:  center;
      padding:     32px 20px 72px;
      position:    relative;
      border-bottom: 1.5px solid var(--line);
    }

    .wave-divider {
      position: absolute;
      left: 0; right: 0; bottom: -1px;
      width: 100%; height: 46px;
      display: block;
      color: var(--bg);
    }

    .lang-badge {
      display:        inline-block;
      font-size:      0.7rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color:          var(--accent);
      border:         1.5px solid var(--accent);
      border-radius:  4px;
      padding:        6px 16px 4px;
      margin-bottom:  16px;
      background:     rgba(255,255,255,0.3);
    }

    .lang-title {
      font-family: 'Caveat', cursive;
      font-size:   2.6rem;
      font-weight: 700;
      color:       var(--ink);
      margin-bottom: 8px;
      line-height: 1.1;
    }

    .lang-subtitle {
      font-size:   1rem;
      color:       var(--ink-soft);
      letter-spacing: 0.01em;
    }

    /* Body */
    .lang-body {
      padding:   52px 18px 48px;
      max-width: 640px;
      margin:    0 auto;
      animation: fadeUp 0.35s cubic-bezier(0.25,0.46,0.45,0.94) 0.08s both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Search */
    .lang-search-wrap {
      position:      relative;
      margin-bottom: 22px;
    }
    .lang-search {
      width:       100%;
      padding:     11px 16px 11px 40px;
      background:  var(--card-bg);
      border:      1.5px solid var(--line);
      border-radius: 999px;
      font-family: 'Patrick Hand', sans-serif;
      font-size:   0.95rem;
      color:       var(--ink);
      outline:     none;
      transition:  border-color 0.12s ease, box-shadow 0.12s ease;
    }
    .lang-search:focus {
      border-color: var(--accent);
      box-shadow:   0 0 0 3px rgba(176,87,48,0.12);
    }
    .lang-search::placeholder { color: var(--ink-soft); }
    .lang-search-icon {
      position:      absolute;
      left:          13px;
      top:           50%;
      transform:     translateY(-50%);
      color:         var(--ink-soft);
      pointer-events: none;
      font-size:     1rem;
    }

    /* Pill grid */
    .lang-grid {
      display:   flex;
      flex-wrap: wrap;
      gap:       8px;
    }

    .lang-btn {
      display:        inline-flex;
      align-items:    center;
      gap:            6px;
      background:     var(--card-bg);
      border:         1.5px solid var(--line);
      border-radius:  999px;
      color:          var(--ink-soft);
      padding:        6px 16px;
      font-family:    'Patrick Hand', sans-serif;
      font-size:      0.9rem;
      font-weight:    400;
      cursor:         pointer;
      white-space:    nowrap;
      transition:     background 0.1s ease, border-color 0.1s ease, color 0.1s ease, transform 0.1s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .lang-btn:hover {
      background:   var(--accent-tint);
      border-color: var(--accent);
      color:        var(--accent);
      transform:    translateY(-1px);
    }
    .lang-btn:active { transform: translateY(0); }

    /* Italian — accent highlight */
    .lang-btn.lang-it {
      background:   var(--accent);
      border-color: var(--accent-deep);
      color:        var(--card-bg);
      font-weight:  700;
    }
    .lang-btn.lang-it:hover {
      background: var(--accent-deep);
    }

    .lang-btn.hidden { display: none; }

    .lang-empty {
      display:    none;
      color:      var(--ink-soft);
      font-style: italic;
      font-size:  0.9rem;
      padding:    8px 0;
    }
    .lang-empty.visible { display: block; }
  </style>
</head>
<body>

  <header class="lang-header">
    <div class="lang-badge">Hotel Touring Livigno</div>
    <h1 class="lang-title">Benvenuti — Welcome</h1>
    <p class="lang-subtitle">Scegli la lingua / Choose your language</p>
    <svg class="wave-divider" viewBox="0 0 1200 46" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0,30 C100,8 200,8 300,26 C400,44 500,44 600,26 C700,8 800,8 900,26 C1000,44 1100,44 1200,26 L1200,46 L0,46 Z" fill="currentColor"/>
    </svg>
  </header>

  <main class="lang-body">
    <div class="lang-search-wrap">
      <span class="lang-search-icon">🔍</span>
      <input class="lang-search" id="langSearch" type="search"
             placeholder="Cerca lingua / Search language…"
             autocomplete="off" autocorrect="off" spellcheck="false">
    </div>

    <div class="lang-grid" id="langGrid"></div>
    <p class="lang-empty" id="langEmpty">Nessuna lingua trovata / No language found</p>
  </main>

      { code: 'yi',       name: 'Yiddish — ייִדיש' },
      { code: 'yo',       name: 'Yoruba' },
      { code: 'zu',       name: 'Zulu — isiZulu' }
    ];

    var grid  = document.getElementById('langGrid');
    var empty = document.getElementById('langEmpty');
    var input = document.getElementById('langSearch');

    LANGS.forEach(function (lang) {
      var btn = document.createElement('button');
      btn.className = 'lang-btn' + (lang.code === 'it' ? ' lang-it' : '');
      btn.dataset.name = lang.name.toLowerCase();
      btn.textContent = lang.name;
      btn.addEventListener('click', function () { selectLang(lang.code); });
      grid.appendChild(btn);
    });

    input.addEventListener('input', function () {
      var q = this.value.trim().toLowerCase();
      var visible = 0;
      grid.querySelectorAll('.lang-btn').forEach(function (btn) {
        var match = !q || btn.dataset.name.indexOf(q) !== -1;
        btn.classList.toggle('hidden', !match);
        if (match) visible++;
      });
      empty.classList.toggle('visible', visible === 0);
    });

    function selectLang(code) {
      localStorage.setItem('menuLang', code);
      var hostname = window.location.hostname;
      if (code === 'it') {
        document.cookie = 'googtrans=;path=/;expires=Thu, 01 Jan 1970 00:00:00 GMT';
        if (hostname && hostname !== 'localhost') {
          document.cookie = 'googtrans=;path=/;domain=' + hostname + ';expires=Thu, 01 Jan 1970 00:00:00 GMT';
        }
      } else {
        var val = '/it/' + code;
        document.cookie = 'googtrans=' + val + ';path=/';
        if (hostname && hostname !== 'localhost') {
          document.cookie = 'googtrans=' + val + ';path=/;domain=' + hostname;
        }
      }
      var returnUrl = sessionStorage.getItem('langReturn') || 'index.html';
      sessionStorage.removeItem('langReturn');
      window.location.replace(returnUrl);
    }
  </script>
